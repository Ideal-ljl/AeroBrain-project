[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aerobrain"
version = "0.1.0"
description = "MSP + MAM model and checkpoint loading"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.6", "transformers==5.5.0", "safetensors>=0.7", "numpy", "Pillow"]

[project.urls]
Repository = "https://github.com/Ideal-ljl/AeroBrain-project"
Issues = "https://github.com/Ideal-ljl/AeroBrain-project/issues"

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools]
py-modules = ["load_model"]

[tool.setuptools.packages.find]
where = ["."]
include = ["openfly_his*", "airbrain*"]

[tool.black]
target-version = ["py310"]
